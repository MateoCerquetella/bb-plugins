<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action Topbar 0.45.0 compatibility repair</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #17181a;
        --foreground: #f4f4f5;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --popover: #242528;
        --primary: #8b5cf6;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      header {
        display: flex;
        height: 48px;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-bottom: 1px solid var(--border);
      }
      .tabs { display: flex; gap: 4px; }
      button {
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--popover);
        color: inherit;
      }
      .plus { width: 30px; font-size: 18px; }
      main {
        display: grid;
        min-height: calc(100vh - 48px);
        grid-template-columns: 1fr 36%;
      }
      .conversation { padding: 28px; color: var(--muted); }
      .pane {
        position: relative;
        border-left: 1px solid var(--border);
        background: #202124;
      }
      .overlay {
        position: absolute;
        inset: 8px;
        display: grid;
        place-items: center;
        border: 2px solid var(--primary);
        background: rgb(139 92 246 / 0.12);
        color: var(--foreground);
        font-weight: 600;
      }
      .launcher {
        position: fixed;
        z-index: 20;
        top: 54px;
        left: 140px;
        width: min(320px, calc(100vw - 16px));
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--popover);
      }
      input {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--background);
        color: inherit;
      }
      .action {
        display: grid;
        width: 100%;
        grid-template-columns: 24px 1fr auto;
        align-items: center;
        margin-top: 6px;
        padding: 0 8px;
        text-align: left;
        cursor: grab;
      }
      .drag-label { color: var(--muted); font-size: 12px; }
      .ghost {
        position: fixed;
        z-index: 30;
        top: 150px;
        left: 58%;
        padding: 7px 10px;
        border: 1px solid var(--primary);
        border-radius: 5px;
        background: var(--popover);
        box-shadow: 0 10px 28px rgb(0 0 0 / 0.35);
      }
      @media (max-width: 640px) {
        main { grid-template-columns: 1fr; }
        .pane { position: absolute; inset: 48px 0 0 35%; }
        .launcher { left: 8px; }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Action Topbar</strong>
      <div class="tabs"><button>Terminal</button><button>Browser</button></div>
      <button class="plus" aria-label="Search open tabs and actions">+</button>
    </header>
    <main>
      <section class="conversation">
        Existing visual treatment is intentionally unchanged. The repair
        restores the host-owned drag bridge removed from BB 0.45.0.
      </section>
      <section class="pane">
        <div class="overlay">Open Start terminal here</div>
      </section>
    </main>
    <section class="launcher" aria-label="Open a panel tab">
      <input placeholder="Search open tabs or actions…" />
      <button class="action">
        <span>T</span><span>Start terminal</span><span class="drag-label">Drag</span>
      </button>
      <button class="action">
        <span>B</span><span>Open browser</span><span class="drag-label">Drag</span>
      </button>
    </section>
    <div class="ghost">Start terminal</div>
  </body>
</html>
